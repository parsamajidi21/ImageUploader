name: Build

# Builds all platforms and runs the tests on every push. On a v* tag the
# packages are attached to that tag's GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libudisks2-dev zip zstd cpio
      - name: Build GTK, X11 and text interfaces
        run: |
          cd src
          USE_GTK=1 make all
          ./imageuploader --version
          make clean && make all && ./imageuploader --version
          make clean && USE_TUI=1 make all && ./imageuploader --version
      - name: Tests
        run: tests/run.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make zip gzip bzip2 xz zstd tar cpio
            mingw-w64-x86_64-gcc
      - name: Build
        run: |
          cd src
          make all package
          make clean
          USE_WRONLY=1 make all package
          ls -la ..
      - name: Tests
        run: tests/run.sh
      - name: Smoke test (the window must open and stay open)
        shell: pwsh
        run: |
          $zip = Get-ChildItem imageuploader_*-x86_64-win-gdi.zip | Where-Object Name -notmatch '_wo-'
          Expand-Archive $zip -DestinationPath smoke
          $p = Start-Process smoke/ImageUploader/imageuploader.exe -PassThru
          Start-Sleep 5
          if ($p.HasExited) { throw "imageuploader.exe exited with code $($p.ExitCode)" }
          $p.MainWindowTitle
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: imageuploader_*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME (Get-Item imageuploader_*.zip) --clobber

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install zstd xz || true
      - name: Build
        run: |
          cd src
          make all package
          file imageuploader
          ./imageuploader --version
          ls -la ..
      - name: Tests
        run: tests/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: imageuploader_*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" imageuploader_*.zip --clobber
